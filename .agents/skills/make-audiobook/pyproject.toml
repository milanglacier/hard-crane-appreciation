[project]
name = "make-audiobook"
version = "0.1.0"
description = "Turn Markdown transcripts into narrated audiobooks with a synced-transcript web player"
requires-python = ">=3.11"
dependencies = [
  "markdown-it-py>=3.0",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.scripts]
audiobook-stats = "audiobook_lib.cli.transcript_stats:main"
audiobook-synth = "audiobook_lib.cli.synth:main"
audiobook-build = "audiobook_lib.cli.build_site:main"
audiobook-serve = "audiobook_lib.cli.serve:main"
audiobook-clean = "audiobook_lib.cli.clean:main"
audiobook-cache = "audiobook_lib.cli.cache:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audiobook_lib"]

# The player assets live at the repo root but must also travel inside the wheel,
# where there is no repo to fall back to (see cli/build_site.py).
[tool.hatch.build.targets.wheel.force-include]
"assets/site" = "audiobook_lib/assets/site"

[tool.pytest.ini_options]
testpaths = ["tests"]
